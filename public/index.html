<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta property="og:image" content="https://locketgold.app/banner.png">
    <meta property="og:locale" content="vi_VN">

    <!-- ═══ FAVICON ═══ -->
    <link rel="icon" type="image/png" href="/img/logo/icon.jpg">
    <link rel="shortcut icon" href="/img/logo/icon.jpg">

    <!-- ═══ REDIRECT ═══ -->
    <!-- Chuyển hướng tự động sau 0 giây -->
    <meta http-equiv="refresh" content="0; url=/trangchu.html">

    <!-- ═══ STYLES CHO TRANG LOADING ═══ -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d0d18;
            background-image: radial-gradient(ellipse at 20% 50%, rgba(167, 139, 250, 0.12) 0%, transparent 60%), radial-gradient(ellipse at 80% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 60%);
        }
        
        .loading-container {
            text-align: center;
            animation: fadeIn 0.6s ease both;
        }
        
        .logo-wrapper {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(167, 139, 250, 0.3);
            animation: pulseGlow 2s ease-in-out infinite;
        }
        
        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        h1 {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }
        
        h1 span {
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            color: rgba(255, 255, 255, 0.4);
            font-size: 15px;
            font-weight: 400;
            margin-bottom: 24px;
        }
        
        .spinner {
            display: inline-block;
            width: 36px;
            height: 36px;
            border: 3px solid rgba(167, 139, 250, 0.15);
            border-top-color: #a78bfa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        .redirect-text {
            margin-top: 16px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 13px;
        }
        
        .redirect-text a {
            color: #a78bfa;
            text-decoration: none;
            font-weight: 600;
        }
        
        .redirect-text a:hover {
            text-decoration: underline;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0.95);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        @keyframes pulseGlow {
            0%,
            100% {
                box-shadow: 0 12px 40px rgba(167, 139, 250, 0.3);
            }
            50% {
                box-shadow: 0 12px 60px rgba(167, 139, 250, 0.5);
            }
        }
    </style>
</head>

<body>

    <div class="loading-container">
        <!-- Logo -->
        <div class="logo-wrapper">
            <img src="/img/logo/icon.jpg" alt="Locket Gold">
        </div>

        <!-- Tiêu đề -->
        <h1>Locket <span>Gold</span></h1>
        <p class="subtitle">Hệ thống nâng cấp Locket Gold tự động</p>

        <!-- Spinner -->
        <div class="spinner"></div>

        <!-- Link chuyển hướng (phòng trường hợp meta refresh không hoạt động) -->
        <p class="redirect-text">
            Đang chuyển hướng đến trang chủ...
            <br>
            <a href="/trangchu.html">Nhấn vào đây nếu không tự động chuyển</a>
        </p>
    </div>

    <!-- ═══ JAVASCRIPT FALLBACK ═══ -->
    <script>
        // Fallback: nếu meta refresh không hoạt động
        (function() {
            // Chờ 1.5 giây rồi chuyển hướng
            setTimeout(function() {
                window.location.href = '/trangchu.html';
            }, 1500);

            // Nếu trang đã load xong, chuyển hướng ngay
            if (document.readyState === 'complete') {
                window.location.href = '/trangchu.html';
            }
        })();
    </script>

</body>

</html>
